[package]
name = "discord-quest-completer"
version = "25.10.9"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
discord-sdk = "0.4.0"
tokio = { version = "1.44.2", features = ["macros", "rt", "sync", "time"] }
once_cell = "1.21.3"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "=0.11", features = ["json", "multipart", "brotli", "gzip", "blocking"] }
window-vibrancy = "0.5"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
