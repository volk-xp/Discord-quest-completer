name: 'publish'

on:
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            x-target: 'win32-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Validate updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY must be configured for signed releases."
          }

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Verify increasing release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-versions.json
          version=$(node scripts/release-version.mjs release release-versions.json)
          echo "version=$version" >> "$GITHUB_ENV"
          printf '%s\n' "$version" > version.txt

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      
      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Get Game List
        shell: bash
        env:
          GAME_LIST_URL: ${{ secrets.GAME_LIST_URL }}
        run: |
          set -euo pipefail
          curl --fail --show-error --location --output src/assets/gamelist.json "$GAME_LIST_URL"
          node scripts/validate-catalog.mjs
      
      - name: Rust cache (Tauri App)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
    
      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: debug bundle contents
        shell: pwsh
        run: |
          Write-Host "--- Contents of src-tauri/target/release/bundle ---"
          Get-ChildItem -Recurse "src-tauri/target/release/bundle"

      - name: stage artifacts for upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/bundle | Out-Null
          New-Item -ItemType Directory -Force -Path staging/data | Out-Null
          Copy-Item src-tauri/target/release/discord-quest-completer.exe staging/
          Copy-Item -Recurse -Force src-tauri/target/release/bundle/* staging/bundle/
          Copy-Item -Recurse -Force src-tauri/target/release/data/* staging/data/
          Copy-Item version.txt staging/
          Write-Host "--- Staged contents ---"
          Get-ChildItem -Recurse staging

      - name: Create artifact for release
        id: create_artifact_for_release
        uses: actions/upload-artifact@v4
        with:
          name: tauri-win-release
          path: staging/

  release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-win-release
          path: tauri-win-release

      - name: read version
        id: read_version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node scripts/release-version.mjs artifact tauri-win-release/version.txt)
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > release-versions.json
          node scripts/release-version.mjs release release-versions.json
          echo "version=$version" >> "$GITHUB_ENV"

      - name: prepare portable zip
        env:
          version: ${{ env.version }}
          win_build_release_dir: discord-quest-completer-win32-x64-${{ env.version }}
        run: |
          mkdir -p ./build/${{ env.win_build_release_dir }}
          cp tauri-win-release/discord-quest-completer.exe ./build/${{ env.win_build_release_dir }}/
          cp -r tauri-win-release/data/ ./build/${{ env.win_build_release_dir }}/
          zip -r ./build/${{ env.win_build_release_dir }}.zip ./build/${{ env.win_build_release_dir }}
          echo "win_build_release_dir=${{ env.win_build_release_dir }}" >> $GITHUB_ENV

      - name: prepare updater artifacts
        shell: bash
        run: |
          set -e
          echo "--- Full contents of downloaded artifact ---"
          find tauri-win-release -type f

          NSIS_EXE=$(find tauri-win-release/bundle/nsis -name "*.exe" 2>/dev/null | head -n1)
          NSIS_SIG=$(find tauri-win-release/bundle/nsis -name "*.exe.sig" 2>/dev/null | head -n1)

          echo "Found NSIS_EXE: $NSIS_EXE"
          echo "Found NSIS_SIG: $NSIS_SIG"

          if [ -z "$NSIS_EXE" ] || [ -z "$NSIS_SIG" ]; then
            echo "Could not find signed NSIS installer or its .sig file. Check that signing secrets are set."
            exit 1
          fi

          cp "$NSIS_EXE" ./build/discord-quest-completer-setup.exe
          node scripts/release-version.mjs manifest tauri-win-release/version.txt "$NSIS_SIG" build/latest.json

      - name: Create Build Artifacts
        uses: actions/upload-artifact@v4
        env: 
          win_build_release_dir: ${{ env.win_build_release_dir }}
        with:
          name: ${{ env.win_build_release_dir }}.zip
          path: | 
            ./build/${{ env.win_build_release_dir }}.zip
            tauri-win-release/bundle/**/*

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: Release ${{ env.version }}
          body_path: RELEASE_NOTES.md
          files: |
            ./build/${{ env.win_build_release_dir }}.zip
            ./build/discord-quest-completer-setup.exe
            ./build/latest.json
          # Must stay false. The in-app updater reads
          # /releases/latest/download/latest.json, and GitHub's "latest"
          # endpoint skips over prereleases entirely — marking a release as a
          # prerelease makes it invisible to the updater, so check() 404s and
          # no user ever sees the update banner.
          prerelease: false
          # Still created as a draft so the release can be reviewed first.
          # Clicking "Publish release" on GitHub is what makes it "latest"
          # and actually delivers the update to installed clients.
          draft: true
        env:
          version: ${{ env.version }}
          win_build_release_dir: ${{ env.win_build_release_dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
