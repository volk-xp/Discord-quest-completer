name: 'publish'

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            x-target: 'win32-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: compute version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          echo "version=$version" >> $env:GITHUB_ENV
          Set-Content -Path version.txt -Value $version
          Write-Host "Computed version: $version"

      - name: patch tauri.conf.json version
        shell: pwsh
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.version = "${{ env.version }}"
          $conf | ConvertTo-Json -Depth 20 | Set-Content -Path $confPath
          Write-Host "Patched tauri.conf.json version to: $($conf.version)"
          Write-Host "--- Full file after patch ---"
          Get-Content $confPath

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          run_install: false
      
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-
      
      - name: Cache Cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-index-

      - name: Get Game List
        shell: bash
        env:
          GAME_LIST_URL: ${{ secrets.GAME_LIST_URL }}
        run: |
          curl -L -o src/assets/gamelist.json $GAME_LIST_URL
          if [ ! -f src/assets/gamelist.json ]; then
            echo "Failed to download game list"
            exit 1
          fi
          if [ ! -s src/assets/gamelist.json ]; then
            echo "Game list is empty"
            exit 1
          fi
      
      # Build src-win
      - name: Build src-win project x86_64 binary
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: | 
          cd src-win
          cargo build --release --verbose
          cd ..
          cp ./src-win/target/release/src-win.exe ./src-tauri/resources/src-win.exe

      - name: Rust cache (Tauri App)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
    
      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: debug bundle contents
        shell: pwsh
        run: |
          Write-Host "--- Contents of src-tauri/target/release/bundle ---"
          Get-ChildItem -Recurse "src-tauri/target/release/bundle"

      - name: stage artifacts for upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/bundle | Out-Null
          New-Item -ItemType Directory -Force -Path staging/data | Out-Null
          New-Item -ItemType Directory -Force -Path staging/resources | Out-Null
          Copy-Item src-tauri/target/release/discord-quest-completer.exe staging/
          Copy-Item -Recurse -Force src-tauri/target/release/bundle/* staging/bundle/
          Copy-Item -Recurse -Force src-tauri/target/release/data/* staging/data/
          Copy-Item -Recurse -Force src-tauri/target/release/resources/* staging/resources/
          Copy-Item version.txt staging/
          Write-Host "--- Staged contents ---"
          Get-ChildItem -Recurse staging

      - name: Create artifact for release
        id: create_artifact_for_release
        uses: actions/upload-artifact@v4
        with:
          name: tauri-win-release
          path: staging/

  release:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tauri-win-release
          path: tauri-win-release

      - name: read version
        id: read_version
        shell: bash
        run: |
          version=$(cat tauri-win-release/version.txt | tr -d '\r\n')
          echo "version=$version" >> $GITHUB_ENV

      - name: prepare portable zip
        env:
          version: ${{ env.version }}
          win_build_release_dir: discord-quest-completer-win32-x64-${{ env.version }}
        run: |
          mkdir -p ./build/${{ env.win_build_release_dir }}
          cp tauri-win-release/discord-quest-completer.exe ./build/${{ env.win_build_release_dir }}/
          cp -r tauri-win-release/data/ ./build/${{ env.win_build_release_dir }}/
          cp -r tauri-win-release/resources/ ./build/${{ env.win_build_release_dir }}/
          zip -r ./build/${{ env.win_build_release_dir }}.zip ./build/${{ env.win_build_release_dir }}
          echo "win_build_release_dir=${{ env.win_build_release_dir }}" >> $GITHUB_ENV

      - name: prepare updater artifacts
        shell: bash
        run: |
          set -e
          echo "--- Full contents of downloaded artifact ---"
          find tauri-win-release -type f

          NSIS_EXE=$(find tauri-win-release/bundle/nsis -name "*.exe" 2>/dev/null | head -n1)
          NSIS_SIG=$(find tauri-win-release/bundle/nsis -name "*.exe.sig" 2>/dev/null | head -n1)

          echo "Found NSIS_EXE: $NSIS_EXE"
          echo "Found NSIS_SIG: $NSIS_SIG"

          if [ -z "$NSIS_EXE" ] || [ -z "$NSIS_SIG" ]; then
            echo "Could not find signed NSIS installer or its .sig file. Check that signing secrets are set."
            exit 1
          fi

          cp "$NSIS_EXE" ./build/discord-quest-completer-setup.exe
          SIGNATURE=$(cat "$NSIS_SIG")
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > ./build/latest.json <<EOF
          {
            "version": "${{ env.version }}",
            "notes": "See the release page for details.",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://github.com/${{ github.repository }}/releases/download/${{ env.version }}/discord-quest-completer-setup.exe"
              }
            }
          }
          EOF

      - name: Create Build Artifacts
        uses: actions/upload-artifact@v4
        env: 
          win_build_release_dir: ${{ env.win_build_release_dir }}
        with:
          name: ${{ env.win_build_release_dir }}.zip
          path: | 
            ./build/${{ env.win_build_release_dir }}.zip
            tauri-win-release/bundle/**/*

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.version }}
          name: Pre-Release ${{ env.version }}
          body: |
            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/volk-xp/Discord-quest-completer-by-Volk/${{ env.version }}/${{ env.win_build_release_dir }}.zip)

            #### Disclaimer
            This tool is intended for educational purposes and personal use. Please respect Discord's terms of service and game publishers' rights when using this application.  
            
            The creators and maintainers of this project are not liable for any damages, account suspensions, or other consequences that may arise from using this software. Use at your own risk. This project is not affiliated with, endorsed by, or connected to Discord in any way.
          append_body: true
          generate_release_notes: true
          files: |
            ./build/${{ env.win_build_release_dir }}.zip
            ./build/discord-quest-completer-setup.exe
            ./build/latest.json
          prerelease: true
          draft: true
        env:
          version: ${{ env.version }}
          win_build_release_dir: ${{ env.win_build_release_dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
